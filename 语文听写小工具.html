<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语文听写助手</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 24px 16px 60px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #eef2fb, #f7f9fd 320px);
    color: #243043;
  }
  .app { max-width: 820px; margin: 0 auto; }
  header h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: 1px; }
  header .sub { margin: 0; color: #7a8699; font-size: 14px; }

  .tabs { display: flex; gap: 8px; margin: 20px 0 16px; }
  .tab {
    flex: 1; padding: 12px; border: none; border-radius: 12px;
    background: #e6ebf5; color: #4a5a75; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: .2s; font-family: inherit;
  }
  .tab.active { background: #3b6ef6; color: #fff; box-shadow: 0 6px 16px rgba(59,110,246,.3); }

  .panel { display: none; }
  .panel.active { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .card {
    background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 16px;
    box-shadow: 0 2px 12px rgba(30,50,90,.06);
  }
  .card h2 { margin: 0 0 8px; font-size: 17px; }
  .sub-title { font-size: 14px; color: #7a8699; margin: 18px 0 8px; font-weight: 600; }
  .hint { color: #7a8699; font-size: 13px; margin: 0 0 12px; line-height: 1.7; }
  code { background: #eef2fb; padding: 1px 6px; border-radius: 6px; color: #3b6ef6; font-size: 12px; }

  textarea {
    width: 100%; border: 1px solid #e3e8f0; border-radius: 12px; padding: 12px;
    font-size: 14px; font-family: inherit; line-height: 1.8; resize: vertical;
    outline: none; transition: .2s; background: #fafbfe; color: inherit;
  }
  textarea:focus { border-color: #3b6ef6; background: #fff; box-shadow: 0 0 0 3px rgba(59,110,246,.12); }

  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .btn {
    border: none; border-radius: 10px; padding: 10px 18px; font-size: 14px;
    font-weight: 600; cursor: pointer; transition: .18s; font-family: inherit;
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: #3b6ef6; color: #fff; }
  .btn.primary:hover:not(:disabled) { background: #2c56c9; }
  .btn.play { background: #12b886; color: #fff; }
  .btn.play:hover:not(:disabled) { background: #0ca678; }
  .btn.play.stop { background: #fa5252; }
  .btn.play.stop:hover:not(:disabled) { background: #e03131; }
  .btn.ghost { background: #eef2fb; color: #4a5a75; }
  .btn.ghost:hover:not(:disabled) { background: #e0e7f7; }
  .btn.danger { background: #fff0f0; color: #e03131; }
  .btn.danger:hover:not(:disabled) { background: #ffe0e0; }
  .btn.export { background: #7048e8; color: #fff; }
  .btn.export:hover:not(:disabled) { background: #5f3dc4; }
  .btn.import { background: #15aabf; color: #fff; }
  .btn.import:hover:not(:disabled) { background: #1098ad; }

  .status {
    margin: 14px 0 0; font-size: 14px; color: #4a5a75;
    background: #f4f7fd; border-radius: 10px; padding: 10px 14px; line-height: 1.6;
  }
  .poem-hint {
    font-size: 36px; letter-spacing: 14px; font-weight: 700; color: #3b6ef6;
    text-align: center; padding: 20px 10px 20px 24px;
    background: #f4f7fd; border-radius: 12px; text-indent: 14px;
  }
  .word-list { display: flex; flex-wrap: wrap; gap: 10px; }
  .word {
    background: #eef2fb; color: #243043; border-radius: 10px;
    padding: 8px 14px; font-size: 17px; font-weight: 600; letter-spacing: 1px;
  }
  .poem-full {
    white-space: pre-line; line-height: 2; font-size: 16px;
    background: #f8fafd; border-radius: 12px; padding: 16px;
  }
  .empty { color: #a3adbe; font-size: 14px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>📖 语文听写助手</h1>
    <p class="sub">生词 · 古诗词 导入与听写（数据保存在本机浏览器）</p>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="import">导入</button>
    <button class="tab" data-tab="dictation">听写</button>
  </nav>

  <!-- ============ 导入面板 ============ -->
  <section id="panel-import" class="panel active">
    <div class="card">
      <h2>生词导入</h2>
      <p class="hint">多个生词请用<strong>逗号</strong>分隔（中英文逗号、顿号、换行均可），例如：<code>踌躇，蹒跚，憧憬，斑斓</code></p>
      <textarea id="vocabInput" rows="4" placeholder="踌躇，蹒跚，憧憬，斑斓"></textarea>
      <div class="row">
        <button id="importVocabBtn" class="btn primary">导入生词</button>
        <button id="clearVocabBtn" class="btn ghost">清空生词</button>
      </div>
    </div>

    <div class="card">
      <h2>古诗词导入</h2>
      <p class="hint">多首古诗词请用 <code>---</code> 分隔；建议第一行写标题，下面写正文。</p>
      <textarea id="poemInput" rows="8" placeholder="静夜思
床前明月光，疑是地上霜。
举头望明月，低头思故乡。
---
春晓
春眠不觉晓，处处闻啼鸟。
夜来风雨声，花落知多少。"></textarea>
      <div class="row">
        <button id="importPoemBtn" class="btn primary">导入古诗词</button>
        <button id="clearPoemBtn" class="btn ghost">清空古诗词</button>
      </div>
    </div>

    <div class="card">
      <h2>数据概览</h2>
      <p id="stats" class="hint">生词 0 个 · 古诗词 0 首</p>
      <div class="row">
        <button id="exportBtn" class="btn export">导出全部数据</button>
        <button id="importJsonBtn" class="btn import">导入JSON</button>
        <button id="clearAllBtn" class="btn danger">清空全部数据</button>
      </div>
      <p class="hint" style="margin:12px 0 0">
        导出：将全部生词、古诗词及其听写次数保存为 JSON 文件。<br>
        导入JSON：选择之前导出的备份文件，可选择「合并」或「覆盖」现有数据。
      </p>
      <input type="file" id="jsonFileInput" accept=".json,application/json" hidden>
    </div>
  </section>

  <!-- ============ 听写面板 ============ -->
  <section id="panel-dictation" class="panel">
    <div class="card">
      <div class="row" style="margin-top:0">
        <button id="generateBtn" class="btn primary">生成本次听写</button>
        <button id="playBtn" class="btn play" disabled>开始听写</button>
        <button id="checkBtn" class="btn ghost" disabled>检查</button>
      </div>
      <p id="status" class="status">请先点击「生成本次听写」。</p>
    </div>

    <div class="card" id="hintCard" style="display:none">
      <h2>古诗词默写</h2>
      <p class="hint">下面只给出这首古诗词的<strong>前 5 个汉字</strong>，请默写整首。</p>
      <div id="poemHint" class="poem-hint"></div>
    </div>

    <div class="card" id="answerCard" style="display:none">
      <h2>听写结果</h2>
      <h3 class="sub-title">本次生词（<span id="wordCount">0</span> 个）</h3>
      <div id="wordList" class="word-list"></div>
      <h3 class="sub-title">古诗词</h3>
      <div id="poemFull" class="poem-full"></div>
    </div>
  </section>
</div>

<script>
(function () {
  'use strict';

  /* ================= 常量与状态 ================= */
  const VOCAB_KEY = 'yw_dictation_vocab_v1';
  const POEM_KEY  = 'yw_dictation_poems_v1';
  const WORD_PER_ROUND = 20;   // 每次听写抽取生词数
  const REPEAT_TIMES   = 3;    // 每个生词重复次数
  const REPEAT_GAP_MS  = 2000; // 每次重复间隔（毫秒）

  let vocab = [];   // [{ content: '词语', count: 0 }]
  let poems = [];   // [{ content: '整首诗', count: 0 }]
  let current = { words: [], poem: null };

  let playing = false;      // 是否正在播放
  let stopFlag = false;     // 停止标记
  let currentResolve = null;// 当前语音 Promise 的 resolve

  /* ================= 元素引用 ================= */
  const $ = id => document.getElementById(id);
  const statsEl       = $('stats');
  const vocabInput    = $('vocabInput');
  const poemInput     = $('poemInput');
  const generateBtn   = $('generateBtn');
  const playBtn       = $('playBtn');
  const checkBtn      = $('checkBtn');
  const statusEl      = $('status');
  const hintCard      = $('hintCard');
  const poemHintEl    = $('poemHint');
  const answerCard    = $('answerCard');
  const wordListEl    = $('wordList');
  const wordCountEl   = $('wordCount');
  const poemFullEl    = $('poemFull');
  const jsonFileInput = $('jsonFileInput');

  /* ================= 本地存储 ================= */
  function loadData() {
    try { vocab = JSON.parse(localStorage.getItem(VOCAB_KEY)) || []; } catch (e) { vocab = []; }
    try { poems = JSON.parse(localStorage.getItem(POEM_KEY))  || []; } catch (e) { poems = []; }
    // 兼容纯字符串的旧数据
    vocab = vocab.map(x => (typeof x === 'string' ? { content: x, count: 0 } : x))
                 .filter(x => x && x.content);
    poems = poems.map(x => (typeof x === 'string' ? { content: x, count: 0 } : x))
                 .filter(x => x && x.content);
  }
  function saveData() {
    localStorage.setItem(VOCAB_KEY, JSON.stringify(vocab));
    localStorage.setItem(POEM_KEY, JSON.stringify(poems));
  }

  /* ================= 工具函数 ================= */
  const esc = s => String(s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));

  function setStatus(msg) { statusEl.textContent = msg; }

  function renderStats() {
    statsEl.textContent = `生词 ${vocab.length} 个 · 古诗词 ${poems.length} 首`;
  }

  // 抽取 n 条：优先抽「听写次数」少的，同次数之间随机
  function pickRecords(arr, n) {
    const copy = arr.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    copy.sort((a, b) => (a.count || 0) - (b.count || 0)); // sort 稳定，保留随机性
    return copy.slice(0, n);
  }

  // 取文本中的前 n 个汉字
  function firstHanzi(text, n) {
    const m = text.match(/[\u4e00-\u9fff]/g) || [];
    return m.slice(0, n).join('');
  }

  // 古诗提示：若首行短且无标点，视为标题跳过
  function poemHintText(text) {
    const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    let body = text;
    if (lines.length > 1) {
      const first = lines[0];
      if (first.length <= 6 && !/[，。！？；：、,.!?;:]/.test(first)) {
        body = lines.slice(1).join('\n');
      }
    }
    return firstHanzi(body, 5);
  }

  function hasGenerated() {
    return current.words.length > 0 || !!current.poem;
  }

  function refreshButtons() {
    if (playing) {
      playBtn.disabled = false;
      playBtn.textContent = '停止播放';
      playBtn.classList.add('stop');
      generateBtn.disabled = true;
      checkBtn.disabled = true;
    } else {
      playBtn.disabled = !hasGenerated();
      playBtn.textContent = '开始听写';
      playBtn.classList.remove('stop');
      generateBtn.disabled = false;
      checkBtn.disabled = !hasGenerated();
    }
  }

  /* ================= 导入功能 ================= */
  $('importVocabBtn').addEventListener('click', function () {
    const raw = vocabInput.value.trim();
    if (!raw) { alert('请先输入生词内容。'); return; }

    // 以逗号分隔（兼容中英文逗号、顿号、分号、换行）
    const items = raw.split(/[,，、;；\r\n]+/).map(s => s.trim()).filter(Boolean);
    if (!items.length) { alert('没有解析到有效的生词。'); return; }

    let added = 0, dup = 0;
    items.forEach(text => {
      if (vocab.some(v => v.content === text)) { dup++; return; }
      vocab.push({ content: text, count: 0 });
      added++;
    });

    saveData();
    renderStats();
    vocabInput.value = '';
    alert(`导入完成：新增 ${added} 个生词${dup ? `，跳过重复 ${dup} 个` : ''}。`);
  });

  $('importPoemBtn').addEventListener('click', function () {
    const raw = poemInput.value.trim();
    if (!raw) { alert('请先输入古诗词内容。'); return; }

    // 以 --- 分隔
    const items = raw.split(/-{3,}/).map(s => s.trim()).filter(Boolean);
    if (!items.length) { alert('没有解析到有效的古诗词。'); return; }

    let added = 0, dup = 0;
    items.forEach(text => {
      if (poems.some(p => p.content === text)) { dup++; return; }
      poems.push({ content: text, count: 0 });
      added++;
    });

    saveData();
    renderStats();
    poemInput.value = '';
    alert(`导入完成：新增 ${added} 首古诗词${dup ? `，跳过重复 ${dup} 首` : ''}。`);
  });

  $('clearVocabBtn').addEventListener('click', function () {
    if (!vocab.length) { alert('当前没有生词。'); return; }
    if (!confirm(`确定清空全部 ${vocab.length} 个生词吗？`)) return;
    vocab = [];
    saveData(); renderStats();
    current = { words: [], poem: null };
    resetDictationView();
  });

  $('clearPoemBtn').addEventListener('click', function () {
    if (!poems.length) { alert('当前没有古诗词。'); return; }
    if (!confirm(`确定清空全部 ${poems.length} 首古诗词吗？`)) return;
    poems = [];
    saveData(); renderStats();
    current = { words: [], poem: null };
    resetDictationView();
  });

  $('clearAllBtn').addEventListener('click', function () {
    if (!confirm('确定清空全部生词与古诗词数据吗？此操作不可恢复。')) return;
    vocab = []; poems = [];
    saveData(); renderStats();
    current = { words: [], poem: null };
    resetDictationView();
  });

  /* ================= 导出功能 ================= */
  function pad2(n) { return String(n).padStart(2, '0'); }

  function dateStamp(d) {
    return `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}`
         + `_${pad2(d.getHours())}${pad2(d.getMinutes())}`;
  }

  $('exportBtn').addEventListener('click', function () {
    if (!vocab.length && !poems.length) {
      alert('当前没有可导出的数据。');
      return;
    }

    const data = {
      app: '语文听写助手',
      version: 1,
      exportedAt: new Date().toISOString(),
      vocabTotal: vocab.length,
      poemTotal: poems.length,
      vocab: vocab.map(v => ({ content: v.content, count: v.count || 0 })),
      poems: poems.map(p => ({ content: p.content, count: p.count || 0 }))
    };

    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const now = new Date();

    const a = document.createElement('a');
    a.href = url;
    a.download = `语文听写数据_${dateStamp(now)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    setTimeout(() => URL.revokeObjectURL(url), 1500);

    alert(`导出完成：生词 ${vocab.length} 个，古诗词 ${poems.length} 首。`);
  });

  /* ================= 导入 JSON ================= */
  $('importJsonBtn').addEventListener('click', function () {
    jsonFileInput.value = ''; // 允许重复选择同一个文件
    jsonFileInput.click();
  });

  jsonFileInput.addEventListener('change', function () {
    const file = jsonFileInput.files && jsonFileInput.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function (e) {
      let data;
      try {
        data = JSON.parse(e.target.result);
      } catch (err) {
        alert('解析失败：该文件不是有效的 JSON 格式。');
        return;
      }
      handleImportedData(data);
    };

    reader.onerror = function () {
      alert('读取文件失败，请重试。');
    };

    reader.readAsText(file, 'utf-8');
  });

  // 把数组规范化为 [{ content, count }]，无法识别的项忽略
  function normalizeList(arr) {
    if (!Array.isArray(arr)) return null;
    const out = [];
    arr.forEach(item => {
      if (typeof item === 'string') {
        const c = item.trim();
        if (c) out.push({ content: c, count: 0 });
      } else if (item && typeof item === 'object' && typeof item.content === 'string') {
        const c = item.content.trim();
        if (!c) return;
        let n = Number(item.count);
        if (!Number.isFinite(n) || n < 0) n = 0;
        out.push({ content: c, count: Math.floor(n) });
      }
    });
    return out;
  }

  function handleImportedData(data) {
    if (!data || typeof data !== 'object' || Array.isArray(data)) {
      alert('数据格式不正确：文件内容应为包含 vocab / poems 字段的对象。');
      return;
    }

    const inVocab = normalizeList(data.vocab);
    const inPoems = normalizeList(data.poems);

    if (inVocab === null && inPoems === null) {
      alert('数据格式不正确：未找到 vocab 或 poems 字段。');
      return;
    }

    const vList = inVocab || [];
    const pList = inPoems || [];

    if (!vList.length && !pList.length) {
      alert('文件中没有可导入的数据。');
      return;
    }

    // 第一步：选择合并还是覆盖
    const mergeChosen = confirm(
      `文件包含：生词 ${vList.length} 个，古诗词 ${pList.length} 首。\n\n` +
      `点击「确定」→ 合并到现有数据（跳过重复内容）\n` +
      `点击「取消」→ 覆盖现有全部数据`
    );

    if (!mergeChosen) {
      // 覆盖：再确认一次，避免误操作
      const ok = confirm(
        `再次确认：将清空当前 ${vocab.length} 个生词、${poems.length} 首古诗词，` +
        `并完全替换为文件中的数据。\n\n此操作不可撤销，确定继续吗？`
      );
      if (!ok) return;

      vocab = vList.slice();
      poems = pList.slice();
      saveData();
      renderStats();
      current = { words: [], poem: null };
      resetDictationView();
      alert(`覆盖完成：现有生词 ${vocab.length} 个，古诗词 ${poems.length} 首。`);
      return;
    }

    // 合并：按内容去重，保留已有记录（含其听写次数）
    let vAdded = 0, vDup = 0, pAdded = 0, pDup = 0;

    vList.forEach(item => {
      if (vocab.some(v => v.content === item.content)) { vDup++; return; }
      vocab.push(item);
      vAdded++;
    });

    pList.forEach(item => {
      if (poems.some(p => p.content === item.content)) { pDup++; return; }
      poems.push(item);
      pAdded++;
    });

    saveData();
    renderStats();
    current = { words: [], poem: null };
    resetDictationView();

    alert(
      `合并完成：\n` +
      `· 生词新增 ${vAdded} 个（跳过重复 ${vDup} 个）\n` +
      `· 古诗词新增 ${pAdded} 首（跳过重复 ${pDup} 首）\n\n` +
      `当前共 ${vocab.length} 个生词、${poems.length} 首古诗词。`
    );
  }

  function resetDictationView() {
    hintCard.style.display = 'none';
    answerCard.style.display = 'none';
    setStatus('请先点击「生成本次听写」。');
    refreshButtons();
  }

  /* ================= 生成听写内容 ================= */
  generateBtn.addEventListener('click', function () {
    if (playing) return;

    if (!vocab.length && !poems.length) {
      alert('还没有数据，请先到「导入」页导入生词或古诗词。');
      return;
    }

    const words = pickRecords(vocab, WORD_PER_ROUND);
    const poem  = pickRecords(poems, 1)[0] || null;

    current = { words, poem };

    // 记录听写次数（默认 0，每生成一次 +1）
    words.forEach(w => { w.count = (w.count || 0) + 1; });
    if (poem) poem.count = (poem.count || 0) + 1;
    saveData();

    // 只展示古诗词前 5 个汉字，不展示生词
    if (poem) {
      poemHintEl.textContent = poemHintText(poem.content) || '（无法提取提示）';
      hintCard.style.display = 'block';
    } else {
      hintCard.style.display = 'none';
    }

    answerCard.style.display = 'none';

    const parts = [];
    parts.push(`生词 ${words.length} 个`);
    parts.push(poem ? '古诗词 1 首' : '古诗词 0 首');
    setStatus(`✅ 已生成本次听写：${parts.join(' + ')}。点击「开始听写」播放生词。`);

    refreshButtons();
  });

  /* ================= 语音播放 ================= */
  function getChineseVoice() {
    if (!('speechSynthesis' in window)) return null;
    const voices = window.speechSynthesis.getVoices() || [];
    return voices.find(v => /zh[-_]CN/i.test(v.lang))
        || voices.find(v => /^zh/i.test(v.lang))
        || voices.find(v => /Chinese/i.test(v.name))
        || null;
  }

  function speak(text) {
    return new Promise(resolve => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-CN';
      u.rate = 0.85;
      u.pitch = 1;
      const v = getChineseVoice();
      if (v) u.voice = v;

      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        currentResolve = null;
        clearTimeout(timer);
        resolve();
      };
      currentResolve = finish;

      const timer = setTimeout(finish, 8000); // 兜底，避免卡死
      u.onend = finish;
      u.onerror = finish;

      window.speechSynthesis.speak(u);
    });
  }

  // 可被 stopFlag 打断的等待
  async function wait(ms) {
    const step = 100;
    let elapsed = 0;
    while (elapsed < ms) {
      if (stopFlag) return;
      const t = Math.min(step, ms - elapsed);
      await new Promise(r => setTimeout(r, t));
      elapsed += t;
    }
  }

  function stopPlay() {
    stopFlag = true;
    try { window.speechSynthesis.cancel(); } catch (e) {}
    if (currentResolve) {
      const f = currentResolve;
      currentResolve = null;
      f();
    }
  }

  async function playAll() {
    if (playing) return;
    if (!hasGenerated()) { alert('请先点击「生成本次听写」。'); return; }
    if (!('speechSynthesis' in window)) {
      alert('当前浏览器不支持语音合成，请使用 Chrome / Edge / Safari 打开。');
      return;
    }

    // 确保语音列表已加载
    window.speechSynthesis.getVoices();

    stopFlag = false;
    playing = true;
    refreshButtons();

    const words = current.words;

    if (!words.length) {
      setStatus('本次没有生词，只有古诗词默写任务。');
      playing = false;
      refreshButtons();
      return;
    }

    for (let i = 0; i < words.length; i++) {
      for (let r = 0; r < REPEAT_TIMES; r++) {
        if (stopFlag) break;
        setStatus(`🔊 正在播放第 ${i + 1}/${words.length} 个生词（第 ${r + 1}/${REPEAT_TIMES} 遍）`);
        await speak(words[i].content);
        if (stopFlag) break;
        // 每个生词的 3 次之间间隔 2 秒；最后一个生词的最后一遍不再等待
        if (!(i === words.length - 1 && r === REPEAT_TIMES - 1)) {
          await wait(REPEAT_GAP_MS);
        }
      }
      if (stopFlag) break;
    }

    const wasStopped = stopFlag;
    playing = false;
    stopFlag = false;
    refreshButtons();
    setStatus(wasStopped
      ? '⏹ 已停止播放。'
      : '✅ 播放结束，请完成默写后点击「检查」查看答案。');
  }

  playBtn.addEventListener('click', function () {
    if (playing) {
      stopPlay();
    } else {
      playAll();
    }
  });

  /* ================= 检查 ================= */
  checkBtn.addEventListener('click', function () {
    if (!hasGenerated()) { alert('请先点击「生成本次听写」。'); return; }

    // 生词列表
    if (current.words.length) {
      wordListEl.innerHTML = current.words
        .map(w => `<span class="word">${esc(w.content)}</span>`)
        .join('');
    } else {
      wordListEl.innerHTML = '<span class="empty">本次没有生词</span>';
    }
    wordCountEl.textContent = current.words.length;

    // 古诗词全文
    poemFullEl.textContent = current.poem
      ? current.poem.content
      : '本次没有古诗词';

    answerCard.style.display = 'block';
    answerCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  /* ================= 标签页切换 ================= */
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      $('panel-' + tab.dataset.tab).classList.add('active');
    });
  });

  /* ================= 初始化 ================= */
  function init() {
    loadData();
    renderStats();
    refreshButtons();

    // 预加载语音列表
    if ('speechSynthesis' in window) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = function () {
        window.speechSynthesis.getVoices();
      };
    }

    // 离开页面时停止播放
    window.addEventListener('beforeunload', function () {
      try { window.speechSynthesis.cancel(); } catch (e) {}
    });
  }

  init();
})();
</script>
</body>
