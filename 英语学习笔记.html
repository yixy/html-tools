<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>英语学习笔记</title>
  <style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --color-bg: #f5f5f5;
  --color-surface: #ffffff;
  --color-border: #e0e0e0;
  --color-text: #333333;
  --color-text-secondary: #666666;
  --color-text-muted: #aaaaaa;
  --color-primary: #4a90d9;
  --color-primary-light: #e8f1fb;
  --sidebar-width: 240px;
  --radius: 8px;
  --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--color-bg);
  color: var(--color-text);
  line-height: 1.5;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ── Layout ──────────────────────────────── */
#sidebar {
  width: var(--sidebar-width);
  min-width: var(--sidebar-width);
  background: var(--color-surface);
  border-right: 1px solid var(--color-border);
  display: flex;
  flex-direction: column;
  z-index: 100;
}

.sidebar-header {
  padding: 20px 16px 8px;
  font-size: 17px;
  font-weight: 700;
}

.sidebar-groups {
  flex: 1;
  overflow-y: auto;
  padding: 0 8px 16px;
}

.group-label {
  padding: 14px 8px 4px;
  font-size: 12px;
  font-weight: 600;
  color: var(--color-text-secondary);
  letter-spacing: 0.5px;
}

.item {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  padding: 8px 10px;
  margin-bottom: 2px;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--color-text);
  font-size: 14px;
  text-align: left;
  cursor: pointer;
  transition: background-color 0.15s;
}

.item:hover:not(.placeholder) {
  background: var(--color-bg);
}

.item.active {
  background: var(--color-primary-light);
  color: var(--color-primary);
  font-weight: 600;
}

.item.placeholder {
  color: var(--color-text-muted);
  cursor: default;
}

.ph-tag {
  flex-shrink: 0;
  font-size: 11px;
  padding: 0 5px;
  border: 1px solid var(--color-border);
  border-radius: 4px;
  color: #c0c0c0;
}

#content {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

/* ── 顶部栏 ───────────────────────────────── */
.content-topbar {
  position: sticky;
  top: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  z-index: 10;
}

#menu-btn {
  display: none;
  border: none;
  background: transparent;
  font-size: 20px;
  color: var(--color-text-secondary);
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
}

#menu-btn:hover {
  background: var(--color-bg);
}

.content-title {
  flex: 1;
  font-size: 15px;
  font-weight: 600;
  color: var(--color-text);
}

.home-link {
  flex-shrink: 0;
  color: var(--color-text-secondary);
  text-decoration: none;
  font-size: 13px;
}

.home-link:hover {
  color: var(--color-primary);
}

/* ── 笔记内容 ─────────────────────────────── */
#markdown-body {
  padding: 24px 32px 48px;
  max-width: 900px;
  width: 100%;
  margin: 0 auto;
}

.markdown-body h1,
.markdown-body h2,
.markdown-body h3,
.markdown-body h4 {
  margin: 1.2em 0 0.5em;
  line-height: 1.35;
}

.markdown-body h1:first-child,
.markdown-body h2:first-child,
.markdown-body h3:first-child {
  margin-top: 0.2em;
}

.markdown-body h1 { font-size: 24px; }
.markdown-body h2 { font-size: 20px; border-bottom: 1px solid var(--color-border); padding-bottom: 6px; }
.markdown-body h3 { font-size: 17px; color: #2b6cb0; }
.markdown-body h4 { font-size: 15px; }

.markdown-body p {
  margin: 0.6em 0;
  font-size: 15px;
  line-height: 1.7;
}

.markdown-body strong {
  color: #2b6cb0;
}

.markdown-body ul,
.markdown-body ol {
  padding-left: 1.7em;
  margin: 0.5em 0;
}

.markdown-body li {
  margin: 3px 0;
  font-size: 15px;
  line-height: 1.7;
}

.markdown-body li > ul,
.markdown-body li > ol {
  margin: 2px 0;
}

.markdown-body table {
  border-collapse: collapse;
  margin: 1em 0;
  font-size: 14.5px;
}

.markdown-body th,
.markdown-body td {
  border: 1px solid var(--color-border);
  padding: 7px 12px;
  text-align: left;
  line-height: 1.6;
}

.markdown-body th {
  background: #f2f7fc;
  font-weight: 600;
}

.markdown-body tr:nth-child(even) td {
  background: #fafafa;
}

.markdown-body code {
  background: #f0f0f0;
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 13.5px;
}

/* ── 状态提示 ─────────────────────────────── */
.state {
  padding: 60px 20px;
  text-align: center;
  color: var(--color-text-secondary);
  font-size: 15px;
}

.state-title {
  font-size: 17px;
  font-weight: 600;
  color: var(--color-text);
  margin-bottom: 10px;
}

.state-hint {
  font-size: 13px;
  color: var(--color-text-muted);
  margin-top: 12px;
  line-height: 1.7;
}

.state-hint code {
  background: #f0f0f0;
  padding: 1px 6px;
  border-radius: 4px;
}

/* ── 移动端抽屉 ───────────────────────────── */
#backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
  z-index: 99;
}

@media (max-width: 768px) {
  #menu-btn {
    display: block;
  }

  #sidebar {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    box-shadow: var(--shadow);
  }

  body.sidebar-open #sidebar {
    transform: translateX(0);
  }

  body.sidebar-open #backdrop {
    display: block;
  }

  #markdown-body {
    padding: 16px 20px 40px;
  }
}
  </style>
</head>
<body>
  <aside id="sidebar">
    <div class="sidebar-header">📒 英语学习笔记</div>
    <nav class="sidebar-groups" id="sidebar-groups"></nav>
  </aside>
  <div id="backdrop"></div>

  <main id="content">
    <header class="content-topbar">
      <button id="menu-btn" aria-label="打开目录">☰</button>
      <div class="content-title" id="content-title"></div>
      <a class="home-link" href="index.html">← 返回首页</a>
    </header>
    <article id="markdown-body" class="markdown-body"></article>
  </main>

  <script type="application/json" id="notes-manifest">
[
  {
    "group": "词法",
    "items": [
      { "title": "动词", "file": "基础语法/动词.md" },
      { "title": "名词", "file": "基础语法/名词.md" },
      { "title": "代词", "file": "基础语法/代词.md" },
      { "title": "形容词", "file": "基础语法/形容词.md" },
      { "title": "冠词", "file": "基础语法/冠词.md" },
      { "title": "介词", "file": null },
      { "title": "副词", "file": null }
    ]
  },
  {
    "group": "句法",
    "items": [
      { "title": "句子结构", "file": "基础语法/句式结构.md" }
    ]
  },
  {
    "group": "时态",
    "items": [
      { "title": "一般现在时", "file": "基础语法/一般现在时.md" },
      { "title": "现在进行时", "file": "基础语法/现在进行时.md" },
      { "title": "一般过去时", "file": "基础语法/一般过去时.md" },
      { "title": "一般将来时", "file": "基础语法/一般将来时.md" },
      { "title": "现在完成时", "file": "基础语法/现在完成时.md" }
    ]
  },
  {
    "group": "常用句式",
    "items": [
      { "title": "打招呼问候", "file": "常用句式/打招呼问候.md" },
      { "title": "初次见面", "file": "常用句式/初次见面.md" },
      { "title": "国籍", "file": "常用句式/国籍.md" },
      { "title": "这是你的吗？", "file": "常用句式/这是你的吗？.md" },
      { "title": "它是什么牌子的？", "file": "常用句式/它是什么牌子的？.md" },
      { "title": "你的...是什么颜色的？", "file": "常用句式/你的...是什么颜色的？.md" },
      { "title": "问多少", "file": "常用句式/问多少.md" },
      { "title": "给某人某物", "file": "常用句式/给某人某物.md" },
      { "title": "询问怎么了", "file": "常用句式/询问怎么了.md" },
      { "title": "动作相关", "file": "常用句式/动作相关.md" },
      { "title": "三到达", "file": "常用句式/三到达.md" },
      { "title": "Therebe句型", "file": "常用句式/Therebe句型.md" },
      { "title": "太……以至于不能……", "file": "常用句式/太……以至于不能…….md" },
      { "title": "工作", "file": "常用句式/工作.md" }
    ]
  }
]
  </script>
  <script src="libs/marked.min.js"></script>
  <script id="app-script">
(function () {
  'use strict';

  /* ── 清单 → 扁平索引 ───────────────────────── */
  const manifest = JSON.parse(document.getElementById('notes-manifest').textContent);

  // key = `${group}/${title}` → { group, item }
  const entries = new Map();
  let firstAvailable = null;
  for (const g of manifest) {
    for (const item of g.items) {
      if (item.file === null) continue;
      const key = `${g.group}/${item.title}`;
      entries.set(key, { group: g.group, item });
      if (!firstAvailable) firstAvailable = { key, group: g.group, item };
    }
  }

  /* ── 侧边栏渲染 ───────────────────────────── */
  const groupsEl = document.getElementById('sidebar-groups');

  for (const g of manifest) {
    const label = document.createElement('div');
    label.className = 'group-label';
    label.textContent = g.group;
    groupsEl.appendChild(label);

    for (const item of g.items) {
      const btn = document.createElement('button');
      btn.className = 'item' + (item.file === null ? ' placeholder' : '');
      btn.dataset.key = `${g.group}/${item.title}`;
      btn.type = 'button';

      const name = document.createElement('span');
      name.textContent = item.title;
      btn.appendChild(name);

      if (item.file === null) {
        const tag = document.createElement('span');
        tag.className = 'ph-tag';
        tag.textContent = '待补充';
        btn.appendChild(tag);
        btn.setAttribute('aria-disabled', 'true');
      }
      groupsEl.appendChild(btn);
    }
  }

  /* ── 路由（hash = #/组/条目）────────────────── */
  // 只对段编码、保留分隔符 /，地址栏可读；畸形 % 序列按无路由处理
  function routeKey() {
    const raw = location.hash.replace(/^#\/?/, '');
    if (!raw) return null;
    try {
      return decodeURIComponent(raw);
    } catch (err) {
      return null;
    }
  }

  function hashFor(key) {
    return '#/' + key.split('/').map(encodeURIComponent).join('/');
  }

  function navigate(key) {
    location.hash = hashFor(key); // 触发 hashchange → 渲染
  }

  /* ── 渲染笔记 ──────────────────────────────── */
  const titleEl = document.getElementById('content-title');
  const bodyEl = document.getElementById('markdown-body');
  let currentKey = null;

  function setActive(key) {
    for (const btn of groupsEl.querySelectorAll('.item')) {
      btn.classList.toggle('active', btn.dataset.key === key);
    }
  }

  function showState(title, hint) {
    bodyEl.innerHTML =
      '<div class="state">' +
      (title ? `<div class="state-title">${title}</div>` : '') +
      (hint ? `<div class="state-hint">${hint}</div>` : '') +
      '</div>';
  }

  async function loadEntry(key, entry) {
    if (key === currentKey) return; // hashchange 与显式调用去重
    currentKey = key;
    setActive(key);
    titleEl.textContent = `${entry.group} · ${entry.item.title}`;
    showState('加载中…');

    try {
      const res = await fetch('pages/english/' + encodeURI(entry.item.file));
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const md = await res.text();
      bodyEl.innerHTML = marked.parse(md);
    } catch (err) {
      console.error('加载笔记失败:', entry.item.file, err);
      showState(
        '笔记加载失败',
        '请通过本地服务器或 GitHub Pages 访问本页面，例如在仓库目录运行 <code>python3 -m http.server</code> 后打开 <code>http://localhost:8000/英语学习笔记.html</code>。<br>直接双击打开（file:// 协议）时无法加载笔记文件。'
      );
    }
  }

  /* ── 事件绑定 ──────────────────────────────── */
  groupsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.item');
    if (!btn || btn.classList.contains('placeholder')) return;
    navigate(btn.dataset.key);
    closeDrawer();
  });

  window.addEventListener('hashchange', () => {
    const key = routeKey();
    const entry = key && entries.get(key);
    if (entry) loadEntry(key, entry);
  });

  /* ── 移动端抽屉 ────────────────────────────── */
  const menuBtn = document.getElementById('menu-btn');
  const backdrop = document.getElementById('backdrop');

  function closeDrawer() {
    document.body.classList.remove('sidebar-open');
  }

  menuBtn.addEventListener('click', () => {
    document.body.classList.toggle('sidebar-open');
  });
  backdrop.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeDrawer();
  });

  /* ── 初始化 ────────────────────────────────── */
  const initial = entries.get(routeKey());
  if (initial) {
    loadEntry(routeKey(), initial);
  } else if (firstAvailable) {
    location.replace(hashFor(firstAvailable.key)); // 可能触发 hashchange
    loadEntry(firstAvailable.key, { group: firstAvailable.group, item: firstAvailable.item });
  } else {
    showState('暂无笔记', '清单中没有可用的笔记条目。');
  }
})();
  </script>
</body>
</html>
