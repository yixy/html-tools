<!DOCTYPE html>

  <title>学习路线图</title>
  <style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --color-bg: #f5f5f5;
  --color-surface: #ffffff;
  --color-border: #e0e0e0;
  --color-text: #333333;
  --color-text-secondary: #666666;
  --color-primary: #4a90d9;
  --color-success: #52c41a;
  --color-warning: #faad14;
  --color-danger: #ff4d4f;
  --color-locked: #d9d9d9;
  --sidebar-width: 220px;
  --card-width: 180px;
  --card-height: 90px;
  --radius: 8px;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
}

body {

  background: var(--color-bg);
  color: var(--color-text);
  line-height: 1.5;
}

#app {

  height: 100vh;
  overflow: hidden;
}

/* ── Layout ──────────────────────────────── */
#sidebar {

  background: var(--color-surface);
  border-right: 1px solid var(--color-border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

#main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  padding: 24px;
}

/* ── Sidebar ─────────────────────────────── */
.sidebar-header {
  padding: 16px 16px 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--color-text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.sidebar-list {
  list-style: none;
  padding: 0 8px;
}

.sidebar-item {
  margin-bottom: 2px;
}

.sidebar-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 10px 12px;
  border: none;
  border-radius: 6px;
  background: transparent;
  cursor: pointer;
  font-size: 14px;
  color: var(--color-text);

}

.sidebar-btn:hover {

}

.sidebar-item.active .sidebar-btn {

}

.sidebar-icon {

}

.sidebar-name {

.sidebar-rename-input {

.sidebar-add-btn {

  font-size: 13px;

}

.sidebar-add-btn:hover {

/* ── Sidebar Data Section ─────────────────── */
.sidebar-data-section {

}

.sidebar-data-label {

.sidebar-data-btn {

  <script id="core-script">
const STORAGE_KEY = 'learning-roadmap-data';

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (data && Array.isArray(data.categories)) {
        return data;
      }
    }
  } catch (e) {
    console.warn('Failed to parse stored data, falling back to presets.');
  }
    return { categories: [] };
}

function saveData(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    console.warn('Failed to save data to localStorage:', e);
  }
}

/** @param {string} id */
function getCategory(data, id) {
  return data.categories.find(c => c.id === id);
}

let _idCounter = Date.now();
function generateId(prefix = '') {
  return `${prefix}${(_idCounter++).toString(36)}`;
}

function addCategory(data, name, icon) {
  const id = generateId('cat-');
  const category = {
    id,
    name,
    icon,
    groups: [],
    stages: [],
    contentTags: [],
    stageTags: [],
  };
  data.categories.push(category);
  saveData(data);
  return category;
}

function updateCategory(data, id, updates) {
  const cat = data.categories.find(c => c.id === id);
  if (!cat) return;
  const { id: _id, ...safeUpdates } = updates;  // prevent id overwrite
  Object.assign(cat, safeUpdates);
  saveData(data);
}

function deleteCategory(data, id) {
  data.categories = data.categories.filter(c => c.id !== id);
  saveData(data);
}

function addStage(data, categoryId, stage) {
  const cat = data.categories.find(c => c.id === categoryId);
  if (!cat) return;
  // Sync percentage from items
  syncPercentage(stage);
  cat.stages.push(stage);
  // Add stage to group's stageIds if group exists
  if (stage.groupId) {
    const group = cat.groups.find(g => g.id === stage.groupId);
    if (group && !group.stageIds.includes(stage.id)) group.stageIds.push(stage.id);
  }
  saveData(data);
}

function updateStage(data, categoryId, stageId, updates) {
  const cat = data.categories.find(c => c.id === categoryId);
  if (!cat) return;
  const stage = cat.stages.find(s => s.id === stageId);
  if (!stage) return;
  Object.assign(stage, updates);
  syncPercentage(stage);
  saveData(data);
}

function deleteStage(data, categoryId, stageId) {
  const cat = data.categories.find(c => c.id === categoryId);
  if (!cat) return;
  // Clean up references
  cat.stages.forEach(s => {
    if (s.prerequisites) s.prerequisites = s.prerequisites.filter(id => id !== stageId);
    if (s.softPrerequisites) s.softPrerequisites = s.softPrerequisites.filter(id => id !== stageId);
  });
  cat.groups.forEach(g => {
    g.stageIds = g.stageIds.filter(id => id !== stageId);
  });
  cat.stages = cat.stages.filter(s => s.id !== stageId);
  saveData(data);
}

function syncPercentage(stage) {
  const total = stage.items.length;
  if (total === 0) {
    stage.percentage = 0;
    return;
  }
  const done = stage.items.filter(i => i.done).length;
  stage.percentage = Math.round((done / total) * 100);
}

function syncStatusFromItems(stage) {
  syncPercentage(stage);
  if (stage.percentage === 100) {
    stage.status = 'completed';
  } else if (stage.percentage > 0) {
    stage.status = 'in-progress';
  } else {
    stage.status = 'not-started';
  }
}

function syncStatusChange(stage, newStatus) {
  if (newStatus === 'completed') {
    stage.items.forEach(i => (i.done = true));
    stage.percentage = 100;
  } else if (newStatus === 'not-started') {
    stage.items.forEach(i => (i.done = false));
    stage.percentage = 0;
  } else if (newStatus === 'in-progress' && stage.percentage === 0) {
    stage.percentage = 1;
  }
  stage.status = newStatus;
}

/** Detect if adding newPrereqs to stageId creates a cycle */
function detectCycle(category, stageId, newPrereqs) {
  const visited = new Set();
  const stack = [...newPrereqs];
  while (stack.length > 0) {
    const current = stack.pop();
    if (current === stageId) return true;
    if (visited.has(current)) continue;
    visited.add(current);
    const stage = category.stages.find(s => s.id === current);
    if (stage) {
      stack.push(...stage.prerequisites);
    }
  }
  return false;
}

/** Check if a stage name is duplicate within a category.
 *  Pass skipId to exclude the stage being edited from the check. */
function isStageNameDuplicate(data, categoryId, name, skipId = null) {
  const cat = data.categories.find(c => c.id === categoryId);
  if (!cat) return false;
  return cat.stages.some(s => s.name === name && s.id !== skipId);
}

function openModal(title, contentFn, onClose) {
  // Backdrop
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';

  // Modal box
  const box = document.createElement('div');
  box.className = 'modal-box';

  // Header
  const header = document.createElement('div');
  header.className = 'modal-header';
  const titleEl = document.createElement('h3');
  titleEl.className = 'modal-title';
  titleEl.textContent = title;
  const closeBtn = document.createElement('button');
  closeBtn.className = 'modal-close';
  closeBtn.innerHTML = '&times;';
  closeBtn.addEventListener('click', close);
  header.appendChild(titleEl);
  header.appendChild(closeBtn);

  // Body
  const body = document.createElement('div');
  body.className = 'modal-body';

  box.appendChild(header);
  box.appendChild(body);
  backdrop.appendChild(box);
  document.body.appendChild(backdrop);

  // Render content into body
  if (contentFn) {
    contentFn(body);
  }

  // Close on backdrop click
  backdrop.addEventListener('click', (e) => {
    if (e.target === backdrop) close();
  });

  // Close on Escape
  function onKey(e) {
    if (e.key === 'Escape') close();
  }
  document.addEventListener('keydown', onKey);

  function close() {
    document.removeEventListener('keydown', onKey);
    backdrop.remove();
    if (onClose) onClose();
  }

  return {
    close,
    setTitle: (t) => { titleEl.textContent = t; },
    setContent: (fn) => {
      body.innerHTML = '';
      fn(body);
    },
  };
}



/**
 * Creates a group combobox (text input + filtered dropdown).

 * @param {string} [initialGroupId] - optional, selects the matching group on init
 * @returns {{ el: HTMLElement, getValue: () => string, setValue: (name: string) => void }}
 */
function createGroupCombobox(category, initialGroupId) {
  const container = document.createElement('div');
  container.className = 'sm-combobox';

  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'sm-select';
  input.placeholder = '选择或输入分组名称';

  // Set initial value from existing group
  if (initialGroupId) {
    const grp = category.groups.find(g => g.id === initialGroupId);
    if (grp) input.value = grp.name;
  }

  const dropdown = document.createElement('div');
  dropdown.className = 'sm-combobox-dropdown';
  container.appendChild(input);
  container.appendChild(dropdown);

  function renderDropdown(filterText) {
    dropdown.innerHTML = '';
    const term = (filterText || '').toLowerCase();
    const filtered = category.groups.filter(g =>
      !term || g.name.toLowerCase().includes(term)
    );

    filtered.forEach(g => {
      const item = document.createElement('div');
      item.className = 'sm-combobox-item';
      item.textContent = g.name;
      item.addEventListener('mousedown', (e) => {
        e.preventDefault();
        input.value = g.name;
        dropdown.style.display = 'none';
      });
      dropdown.appendChild(item);
    });

    // If typed text doesn't exactly match any existing group
    if (filterText && !category.groups.some(g => g.name === filterText)) {
      const hint = document.createElement('div');
      hint.className = 'sm-combobox-item sm-combobox-new';
      hint.textContent = `+ 新建分组 "${filterText}"`;
      hint.addEventListener('mousedown', (e) => {
        e.preventDefault();
        input.value = filterText;
        dropdown.style.display = 'none';
      });
      dropdown.appendChild(hint);
    }

    dropdown.style.display = 'block';
  }

  input.addEventListener('focus', () => renderDropdown(input.value));
  input.addEventListener('input', () => renderDropdown(input.value));
  input.addEventListener('blur', () => {
    setTimeout(() => { dropdown.style.display = 'none'; }, 150);
  });

  return {
    el: container,
    getValue: () => input.value.trim(),
    setValue: (name) => { input.value = name; },
  };
}

/**
 * Resolve a group name to a group id. Creates the group if it doesn't exist.
 * Returns the group id (or empty string if name is blank).
 */
function resolveGroupId(category, groupName, generateId, saveFn) {
  const name = groupName.trim();
  if (!name) return '';

  let group = category.groups.find(g => g.name === name);
  if (!group) {
    group = { id: generateId('grp-'), name, stageIds: [] };
    category.groups.push(group);
    if (typeof saveFn === 'function') saveFn();
  }
  return group.id;
}



function renderFilterBar(container, category, activeContentTags, activeStageTags, setActiveTags) {
  // Remove existing filter bar if any
  const existing = container.querySelector('.filter-bar');
  if (existing) existing.remove();

  if (!category || (category.contentTags.length === 0 && category.stageTags.length === 0)) {
    return;
  }

  const bar = document.createElement('div');
  bar.className = 'filter-bar';

  const label = document.createElement('span');
  label.className = 'filter-bar-label';
  label.textContent = '筛选：';
  bar.appendChild(label);

  // Content tags
  for (const tag of category.contentTags) {
    const chip = _createChip(tag, 'content', activeContentTags, activeStageTags, setActiveTags);
    bar.appendChild(chip);
  }

  // Separator
  if (category.contentTags.length > 0 && category.stageTags.length > 0) {
    const sep = document.createElement('span');
    sep.className = 'filter-bar-sep';
    sep.textContent = '|';
    bar.appendChild(sep);
  }

  // Stage tags
  for (const tag of category.stageTags) {
    const chip = _createChip(tag, 'stage', activeContentTags, activeStageTags, setActiveTags);
    bar.appendChild(chip);
  }

  // Clear all button
  const hasActive = activeContentTags.size > 0 || activeStageTags.size > 0;
  if (hasActive) {
    const clear = document.createElement('button');
    clear.className = 'filter-chip filter-chip--clear';
    clear.textContent = '✕ 全部';
    clear.addEventListener('click', () => setActiveTags([], []));
    bar.appendChild(clear);
  }

  container.appendChild(bar);
}

function _createChip(tag, type, activeContentTags, activeStageTags, setActiveTags) {
  const activeSet = type === 'content' ? activeContentTags : activeStageTags;
  const isActive = activeSet.has(tag.id);

  const chip = document.createElement('button');
  chip.className = 'filter-chip';
  if (isActive) chip.classList.add('filter-chip--active');
  chip.textContent = tag.name;
  chip.addEventListener('click', () => {
    const newContent = new Set(activeContentTags);
    const newStage = new Set(activeStageTags);
    const targetSet = type === 'content' ? newContent : newStage;
    if (targetSet.has(tag.id)) {
      targetSet.delete(tag.id);
    } else {
      targetSet.add(tag.id);
    }
    setActiveTags(newContent, newStage);
  });
  return chip;
}

/**
 * Render the roadmap for a given category.
 */
function renderRoadmap(container, category, activeContentTags, activeStageTags, callbacks, setActiveTags) {
  container.innerHTML = '';

  if (!category) {
    container.innerHTML = `<div class="empty-state">
      <p>欢迎使用学习路线图</p>
      <p>从左侧添加你的第一个学科开始吧！</p>
    </div>`;
    return;
  }

  // Header
  const header = document.createElement('div');
  header.className = 'roadmap-header';
  header.innerHTML = `<h2>${category.icon} ${category.name} — RoadMap</h2>`;
  container.appendChild(header);

  // Filter bar
  renderFilterBar(header, category, activeContentTags, activeStageTags, setActiveTags);

  // Determine which stages are dimmed by filter
  const hasContentFilter = activeContentTags.size > 0;
  const hasStageFilter = activeStageTags.size > 0;
  const isFilterActive = hasContentFilter || hasStageFilter;

  function stageMatchesFilter(stage) {
    if (!isFilterActive) return true;
    let match = true;
    if (hasContentFilter) {
      match = match && stage.tags.content.some(t => activeContentTags.has(t));
    }
    if (hasStageFilter) {
      match = match && stage.tags.stage.some(t => activeStageTags.has(t));
    }
    return match;
  }

  // Determine which stages are locked (prerequisites not all completed)
  function isStageLocked(stage) {
    return stage.prerequisites.some(prereqId => {
      const prereq = category.stages.find(s => s.id === prereqId);
      return !prereq || prereq.status !== 'completed';
    });
  }

  // Groups and stages
  const roadmapArea = document.createElement('div');
  roadmapArea.className = 'roadmap-area';

  // Determine stages order per group
  const groupsToRender = category.groups.length > 0 ? category.groups : [{ id: '__default', name: '', stageIds: category.stages.map(s => s.id) }];

  for (const group of groupsToRender) {
    const groupStages = group.stageIds
      .map(sid => category.stages.find(s => s.id === sid))
      .filter(Boolean);

    if (groupStages.length === 0) continue;

    const groupBlock = document.createElement('div');
    groupBlock.className = 'roadmap-group';

    if (group.name) {
      const groupTitle = document.createElement('div');
      groupTitle.className = 'roadmap-group-title';
      groupTitle.textContent = group.name;
      groupBlock.appendChild(groupTitle);
    }

    const cardsRow = document.createElement('div');
    cardsRow.className = 'roadmap-cards';

    for (const stage of groupStages) {
      const locked = isStageLocked(stage);
      const dimmed = isFilterActive && !stageMatchesFilter(stage);
      const card = createStageCard(stage, locked, dimmed, callbacks.onStageClick);
      cardsRow.appendChild(card);
    }

    groupBlock.appendChild(cardsRow);
    roadmapArea.appendChild(groupBlock);
  }

  container.appendChild(roadmapArea);

  // Empty state for no stages
  if (category.stages.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = '<p>暂无阶段</p><p>点击下方「添加阶段」开始构建路线图</p>';
    roadmapArea.appendChild(empty);
  }

  // Bottom toolbar
  const toolbar = document.createElement('div');
  toolbar.className = 'roadmap-toolbar';
  toolbar.innerHTML = `
    <button class="toolbar-btn" id="btn-manage-tags">管理标签</button>
    <button class="toolbar-btn" id="btn-add-stage">+ 添加阶段</button>
    <button class="toolbar-btn" id="btn-edit-groups">编辑分组</button>
  `;
  toolbar.querySelector('#btn-add-stage').addEventListener('click', callbacks.onAddStage);
  toolbar.querySelector('#btn-edit-groups').addEventListener('click', callbacks.onEditGroups);
  toolbar.querySelector('#btn-manage-tags').addEventListener('click', callbacks.onManageTags);
  container.appendChild(toolbar);
}





function openStageModal(category, stage, appData, isLocked, onSave, onDelete) {
  // Work on a clone so we can cancel without side effects
  const clone = JSON.parse(JSON.stringify(stage));

  function render(body) {
    body.innerHTML = '';

    // ── Status ──
    const statusRow = document.createElement('div');
    statusRow.className = 'sm-row';
    statusRow.innerHTML = '<label class="sm-label">状态</label>';
    const statusSelect = document.createElement('select');

      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = { 'not-started': '未开始', 'in-progress': '进行中', 'completed': '已完成' }[s];
      if (clone.status === s) opt.selected = true;
      statusSelect.appendChild(opt);
    });
    if (isLocked) statusSelect.disabled = true;
    statusSelect.addEventListener('change', () => {
      syncStatusChange(clone, statusSelect.value);
      render(body);
    });
    statusRow.appendChild(statusSelect);
    body.appendChild(statusRow);

    // ── Progress ──
    const pctRow = document.createElement('div');
    pctRow.className = 'sm-row';
    const doneCount = clone.items.filter(i => i.done).length;
    const totalCount = clone.items.length;
    pctRow.innerHTML = `<label class="sm-label">进度</label>
      <div class="sm-progress-bar"><div class="sm-progress-fill" style="width:${clone.percentage}%"></div></div>
      <span class="sm-pct-text">${clone.percentage}% (${doneCount}/${totalCount})</span>`;
    body.appendChild(pctRow);

    // ── Item Checklist ──
    const itemsSection = document.createElement('div');
    itemsSection.className = 'sm-section';
    itemsSection.innerHTML = '<h4 class="sm-section-title">学习清单</h4>';
    const itemsList = document.createElement('ul');
    itemsList.className = 'sm-items-list';

    clone.items.forEach((item, idx) => {
      const li = document.createElement('li');
      li.className = 'sm-item';

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = item.done;
      if (isLocked) cb.disabled = true;
      cb.addEventListener('change', () => {
        clone.items[idx].done = cb.checked;
        syncStatusFromItems(clone);
        render(body);
      });

      const span = document.createElement('span');
      span.textContent = item.text;

      const delBtn = document.createElement('button');
      delBtn.className = 'sm-item-del';
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', () => {
        clone.items.splice(idx, 1);
        syncStatusFromItems(clone);
        render(body);
      });

      li.appendChild(cb);
      li.appendChild(span);
      li.appendChild(delBtn);
      itemsList.appendChild(li);
    });

    // Add item input
    const addItemRow = document.createElement('li');
    addItemRow.className = 'sm-item sm-item--add';
    const addInput = document.createElement('input');
    addInput.type = 'text';
    addInput.placeholder = '输入条目，逗号分隔可批量添加，按 Enter 确认';
    addInput.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const raw = addInput.value.trim();
      if (!raw) return;

      // Split by both English and Chinese commas, trim, skip empties
      const texts = raw
        .split(/[,，]/)
        .map(s => s.trim())
        .filter(s => s.length > 0);

      if (texts.length === 0) return;

      for (const text of texts) {
        clone.items.push({ id: generateId('item-'), text, done: false });
      }
      syncStatusFromItems(clone);
      addInput.value = '';
      render(body);
    });
    addItemRow.appendChild(addInput);
    itemsList.appendChild(addItemRow);

    itemsSection.appendChild(itemsList);
    body.appendChild(itemsSection);

    // ── Content Tags ──
    body.appendChild(_renderTagSection('内容标签', 'content', category, clone, render, body));

    // ── Stage Tags ──
    body.appendChild(_renderTagSection('学段标签', 'stage', category, clone, render, body));

    // ── Hard Dependencies ──
    body.appendChild(_renderDepSection('硬依赖（必须完成）', 'prerequisites', category, clone, render, body));

    // ── Soft Dependencies ──
    body.appendChild(_renderDepSection('软依赖（建议先学）', 'softPrerequisites', category, clone, render, body));

    // ── Group ──
    const groupRow = document.createElement('div');
    groupRow.className = 'sm-row';
    groupRow.innerHTML = '<label class="sm-label">所属分组</label>';
    const combo = createGroupCombobox(category, clone.groupId);
    groupRow.appendChild(combo.el);
    body.appendChild(groupRow);

    // ── Actions ──
    const actions = document.createElement('div');
    actions.className = 'sm-actions';

    const saveBtn = document.createElement('button');
    saveBtn.className = 'sm-btn sm-btn--primary';
    saveBtn.textContent = '保存修改';
    saveBtn.addEventListener('click', () => {
      // Validate no circular dependencies
      if (detectCycle(category, clone.id, clone.prerequisites)) {
        alert('保存失败：检测到循环依赖，请调整前置阶段设置。');
        return;
      }

      // Resolve group from combobox value
      const groupName = combo.getValue();
      const newGroupId = resolveGroupId(category, groupName, generateId, () => {
        // save callback — the caller's onSave handles saving appData
      });

      // Update group stageIds (only when group changes)
      if (stage.groupId !== newGroupId) {
        const oldGroup = category.groups.find(g => g.id === stage.groupId);
        if (oldGroup && oldGroup.stageIds) {
          oldGroup.stageIds = oldGroup.stageIds.filter(sid => sid !== stage.id);
        }
        const newGroup = category.groups.find(g => g.id === newGroupId);
        if (newGroup && !newGroup.stageIds.includes(clone.id)) {
          newGroup.stageIds.push(clone.id);
        }
      }
      clone.groupId = newGroupId;

      // Copy clone back to stage
      Object.assign(stage, clone);
      syncStatusChange(stage, stage.status);
      onSave();
      modal.close();
    });

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'sm-btn sm-btn--danger';
    deleteBtn.textContent = '删除阶段';
    deleteBtn.addEventListener('click', () => {
      if (confirm(`确定要删除「${stage.name}」吗？此操作不可撤销。`)) {
        onDelete();
        modal.close();
      }
    });

    actions.appendChild(saveBtn);
    actions.appendChild(deleteBtn);
    body.appendChild(actions);
  }

  const modal = openModal(stage.name, (body) => render(body));

  // ── Inline title editing ──
  const backdrops = document.querySelectorAll('.modal-backdrop');
  const backdrop = backdrops[backdrops.length - 1];
  const titleEl = backdrop.querySelector('.modal-title');
  titleEl.style.cursor = 'pointer';
  titleEl.title = '点击编辑名称';

  titleEl.addEventListener('click', () => {
    if (titleEl.querySelector('input')) return;

    const originalName = clone.name;
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'sm-select';
    input.value = originalName;
    input.style.cssText = 'font-size:inherit;font-weight:inherit;width:100%;';

    titleEl.textContent = '';
    titleEl.appendChild(input);
    input.focus();
    input.select();

    function confirmEdit() {
      const newName = input.value.trim();
      if (!newName) {
        alert('阶段名称不能为空');
        titleEl.textContent = originalName;
        return;
      }
      if (newName === originalName) {
        titleEl.textContent = originalName;
        return;
      }
      if (isStageNameDuplicate(appData, category.id, newName, clone.id)) {
        alert('该学科下已存在同名阶段');
        titleEl.textContent = originalName;
        return;
      }
      clone.name = newName;
      stage.name = newName;
      saveData(appData);
      titleEl.textContent = newName;
    }

    input.addEventListener('blur', confirmEdit);

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        input.blur();
      } else if (e.key === 'Escape') {
        e.stopPropagation();
        input.removeEventListener('blur', confirmEdit);
        titleEl.textContent = originalName;
      }
    });
  });
}

function _renderTagSection(label, tagType, category, clone, render, bodyParam) {
  const section = document.createElement('div');
  section.className = 'sm-section';
  section.innerHTML = `<h4 class="sm-section-title">${label}</h4>`;

  const tagContainer = document.createElement('div');
  tagContainer.className = 'sm-tags';

  const registry = tagType === 'content' ? category.contentTags : category.stageTags;
  const currentTags = clone.tags[tagType];

  // Show current tags as removable chips
  for (const tagId of currentTags) {
    const tagDef = registry.find(t => t.id === tagId);
    if (!tagDef) continue;
    const chip = document.createElement('span');
    chip.className = 'sm-tag-chip';
    chip.innerHTML = `${tagDef.name} <button class="sm-tag-remove">&times;</button>`;
    chip.querySelector('button').addEventListener('click', () => {
      clone.tags[tagType] = clone.tags[tagType].filter(t => t !== tagId);
      render(bodyParam);
    });
    tagContainer.appendChild(chip);
  }

  // Add tag dropdown (show unused tags)
  const unusedTags = registry.filter(t => !currentTags.includes(t.id));
  if (unusedTags.length > 0) {
    const addSelect = document.createElement('select');
    addSelect.className = 'sm-select sm-tag-add';
    const placeholder = document.createElement('option');
    placeholder.textContent = '添加标签...';
    placeholder.value = '';
    placeholder.selected = true;
    addSelect.appendChild(placeholder);
    unusedTags.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t.id;
      opt.textContent = t.name;
      addSelect.appendChild(opt);
    });
    addSelect.addEventListener('change', () => {
      if (addSelect.value) {
        clone.tags[tagType].push(addSelect.value);
        addSelect.value = '';
        render(bodyParam);
      }
    });
    tagContainer.appendChild(addSelect);
  }

  section.appendChild(tagContainer);
  return section;
}

function _renderDepSection(label, field, category, clone, render, bodyParam) {
  const section = document.createElement('div');
  section.className = 'sm-section';
  section.innerHTML = `<h4 class="sm-section-title">${label}</h4>`;

  const depList = document.createElement('div');
  depList.className = 'sm-deps';

  const depIds = clone[field];

  if (depIds.length === 0) {
    depList.innerHTML = '<span class="sm-dep-empty">（无）</span>';
  } else {
    depIds.forEach(depId => {
      const depStage = category.stages.find(s => s.id === depId);
      const chip = document.createElement('span');
      chip.className = 'sm-dep-chip';
      chip.innerHTML = `${depStage ? depStage.name : depId} <button class="sm-tag-remove">&times;</button>`;
      chip.querySelector('button').addEventListener('click', () => {
        clone[field] = clone[field].filter(id => id !== depId);
        render(bodyParam);
      });
      depList.appendChild(chip);
    });
  }

  // Edit button opens dependency picker
  const editBtn = document.createElement('button');
  editBtn.className = 'sm-btn sm-btn--small';
  editBtn.textContent = '编辑依赖';
  editBtn.addEventListener('click', () => {
    _showDepPicker(label, field, category, clone, () => render(bodyParam));
  });
  depList.appendChild(editBtn);

  section.appendChild(depList);
  return section;
}

function _showDepPicker(label, field, category, clone, onDone) {
  const modal = openModal(`选择${label}`, (body) => {
    body.innerHTML = '<p style="font-size:13px;color:var(--color-text-secondary);margin-bottom:12px;">勾选作为依赖的阶段：</p>';
    const list = document.createElement('div');
    list.className = 'sm-dep-picker-list';

    category.stages.forEach(s => {
      if (s.id === clone.id) return; // Can't depend on self
      const row = document.createElement('label');
      row.className = 'sm-dep-picker-row';

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = clone[field].includes(s.id);
      cb.addEventListener('change', () => {
        if (cb.checked) {
          if (!clone[field].includes(s.id)) clone[field].push(s.id);
        } else {
          clone[field] = clone[field].filter(id => id !== s.id);
        }
      });

      const span = document.createElement('span');
      span.textContent = s.name;

      row.appendChild(cb);
      row.appendChild(span);
      list.appendChild(row);
    });

    body.appendChild(list);

    const doneBtn = document.createElement('button');
    doneBtn.className = 'sm-btn sm-btn--primary';
    doneBtn.style.marginTop = '12px';
    doneBtn.textContent = '确定';
    doneBtn.addEventListener('click', () => {
      modal.close();
      onDone();
    });
    body.appendChild(doneBtn);
  });
}








// 1. Load or initialize data（保持空启动，无铺底预设）
let appData = loadData();


// 2. Build layout
const app = document.querySelector('#app');

const sidebarEl = document.createElement('aside');
sidebarEl.id = 'sidebar';

const mainEl = document.createElement('main');
mainEl.id = 'main-content';

app.appendChild(sidebarEl);
app.appendChild(mainEl);

// 3. Active tag filter state
let activeContentTags = new Set();
let activeStageTags = new Set();

function setActiveTags(content, stage) {
  activeContentTags = new Set(content);
  activeStageTags = new Set(stage);
  render();
}

// 4. Render function — called on route change or data change
function render() {
  const currentId = getCurrentRoute();
  const currentCategory = currentId
    ? appData.categories.find(c => c.id === currentId)
    : appData.categories[0] || null;

  // If no category selected, pick first
  if (!currentId && appData.categories.length > 0) {
    navigate(appData.categories[0].id);
    return;
  }

  // 全局数据操作回调（导出/导入）
  const onExport = () => {
    const json = JSON.stringify(appData, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'roadmap-data.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const onImport = () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.addEventListener('change', () => {
      const file = input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        try {
          const imported = JSON.parse(reader.result);
          if (!imported.categories || !Array.isArray(imported.categories)) {
            alert('导入失败：文件格式不正确（缺少 categories 数组）。');
            return;
          }

          const newCount = imported.categories.filter(c => !appData.categories.find(ex => ex.id === c.id)).length;
          const updateCount = imported.categories.filter(c => appData.categories.find(ex => ex.id === c.id)).length;

          const msg = `即将导入数据：\n\n• ${newCount} 个新学科将被添加\n• ${updateCount} 个已有学科将被更新\n\n当前数据将被覆盖，确定继续？`;
          if (confirm(msg)) {
            appData.categories = imported.categories;
            saveData(appData);
            render();
          }
        } catch (e) {
          alert('导入失败：无法解析 JSON 文件。');
        }
      };
      reader.readAsText(file);
    });
    input.click();
  };

  renderSidebar(sidebarEl, appData, currentId, {
    onSelect: (id) => navigate(id),
    onAdd: (name, icon) => {
      const cat = { id: name.toLowerCase().replace(/\s+/g, '-'), name, icon, groups: [], stages: [], contentTags: [], stageTags: [] };
      appData.categories.push(cat);
      saveData(appData);
      navigate(cat.id);
    },
    onRename: (id, newName) => {
      const cat = appData.categories.find(c => c.id === id);
      if (cat) { cat.name = newName; saveData(appData); render(); }
    },
    onDelete: (id) => {
      appData.categories = appData.categories.filter(c => c.id !== id);
      saveData(appData);
      if (getCurrentRoute() === id) {
        navigate(appData.categories[0]?.id || '');
      } else {
        render();
      }
    },
    onExport,
    onImport,
  });

  renderRoadmap(mainEl, currentCategory, activeContentTags, activeStageTags, {
    onStageClick: (stageId) => {
      const stage = currentCategory.stages.find(s => s.id === stageId);
      if (!stage) return;
      const isLocked = stage.prerequisites.some(prereqId => {
        const prereq = currentCategory.stages.find(s => s.id === prereqId);
        return !prereq || prereq.status !== 'completed';
      });
      openStageModal(currentCategory, stage, appData, isLocked,
        () => {
          // onSave
          saveData(appData);
          render();
        },
        () => {
          // onDelete
          deleteStage(appData, currentCategory.id, stageId);
          saveData(appData);
          render();
        }
      );
    },
    onAddStage: () => {

          let nameValue = '';

          const modal = openModal('添加阶段', (body) => {
            // Name input
            const nameRow = document.createElement('div');
            nameRow.className = 'sm-row';
            nameRow.innerHTML = '<label class="sm-label">阶段名称</label>';
            const nameInput = document.createElement('input');
            nameInput.type = 'text';
            nameInput.className = 'sm-select';
            nameInput.style.flex = '1';
            nameInput.placeholder = '例如：一元二次方程';
            nameInput.addEventListener('input', () => { nameValue = nameInput.value.trim(); });
            nameRow.appendChild(nameInput);
            body.appendChild(nameRow);

            // Group combobox
            const groupRow = document.createElement('div');
            groupRow.className = 'sm-row';
            groupRow.innerHTML = '<label class="sm-label">所属分组</label>';
            const combo = createGroupCombobox(currentCategory, currentCategory.groups[0]?.id || null);
            groupRow.appendChild(combo.el);
            body.appendChild(groupRow);

            // Actions
            const actions = document.createElement('div');
            actions.className = 'sm-actions';
            const confirmBtn = document.createElement('button');
            confirmBtn.className = 'sm-btn sm-btn--primary';
            confirmBtn.textContent = '添加';
            confirmBtn.addEventListener('click', () => {
              if (!nameValue) {
                alert('阶段名称不能为空');
                return;
              }
              if (isStageNameDuplicate(appData, currentCategory.id, nameValue)) {
                alert('该学科下已存在同名阶段');
                return;
              }
              const groupId = resolveGroupId(currentCategory, combo.getValue(), generateId, () => saveData(appData));
              const newStage = {
                id: generateId('stage-'),
                name: nameValue,
                groupId,
                status: 'not-started',
                percentage: 0,
                prerequisites: [],
                softPrerequisites: [],
                tags: { content: [], stage: [] },
                items: [],
              };
              addStage(appData, currentCategory.id, newStage);
              saveData(appData);
              render();
              modal.close();
            });
            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'sm-btn';
            cancelBtn.textContent = '取消';
            cancelBtn.addEventListener('click', () => {
              modal.close();
            });
            actions.appendChild(confirmBtn);
            actions.appendChild(cancelBtn);
            body.appendChild(actions);
          });
    },
    onEditGroups: () => {
        openModal('编辑分组', (body) => {
          body.innerHTML = '';

          const list = document.createElement('div');
          list.className = 'sm-groups-list';

          function renderGroupList() {
            list.innerHTML = '';

            currentCategory.groups.forEach((group, idx) => {
              const item = document.createElement('div');
              item.className = 'sm-group-item';

              // Drag handle
              const handle = document.createElement('span');
              handle.className = 'sm-group-handle';
              handle.textContent = '⋮⋮';
              handle.style.cursor = 'grab';
              handle.style.marginRight = '8px';
              handle.style.color = 'var(--color-text-secondary)';
              item.appendChild(handle);

              // Name input
              const input = document.createElement('input');
              input.type = 'text';
              input.value = group.name;
              input.className = 'sm-select';
              input.style.flex = '1';
              input.addEventListener('change', () => {
                group.name = input.value.trim() || group.name;
                saveData(appData);
                render();
              });
              item.appendChild(input);

              // Up / Down buttons
              const upBtn = document.createElement('button');
              upBtn.className = 'sm-btn sm-btn--small';
              upBtn.textContent = '↑';
              upBtn.title = '上移';
              upBtn.disabled = idx === 0;
              upBtn.addEventListener('click', () => {
                if (idx > 0) {
                  [currentCategory.groups[idx - 1], currentCategory.groups[idx]] =
                    [currentCategory.groups[idx], currentCategory.groups[idx - 1]];
                  saveData(appData);
                  renderGroupList();
                }
              });
              item.appendChild(upBtn);

              const downBtn = document.createElement('button');
              downBtn.className = 'sm-btn sm-btn--small';
              downBtn.textContent = '↓';
              downBtn.title = '下移';
              downBtn.disabled = idx === currentCategory.groups.length - 1;
              downBtn.addEventListener('click', () => {
                if (idx < currentCategory.groups.length - 1) {
                  [currentCategory.groups[idx], currentCategory.groups[idx + 1]] =
                    [currentCategory.groups[idx + 1], currentCategory.groups[idx]];
                  saveData(appData);
                  renderGroupList();
                }
              });
              item.appendChild(downBtn);

              // Delete button (only if group has no stages)
              if (group.stageIds.length === 0) {
                const delBtn = document.createElement('button');
                delBtn.className = 'sm-btn sm-btn--small sm-btn--danger';
                delBtn.textContent = '删除';
                delBtn.addEventListener('click', () => {
                  if (confirm(`确定删除分组「${group.name}」？`)) {
                    currentCategory.groups = currentCategory.groups.filter(g => g.id !== group.id);
                    saveData(appData);
                    renderGroupList();
                  }
                });
                item.appendChild(delBtn);
              } else {
                const hint = document.createElement('span');
                hint.className = 'sm-group-hint';
                hint.textContent = '(该分组下有阶段，无法删除)';
                hint.style.fontSize = '11px';
                hint.style.color = 'var(--color-text-secondary)';
                hint.style.marginLeft = '8px';
                item.appendChild(hint);
              }

              list.appendChild(item);
            });
          }

          renderGroupList();
          body.appendChild(list);
        });
    },
    onManageTags: () => {
        openModal('管理标签', (body) => {
          // Tab buttons
          const tabRow = document.createElement('div');
          tabRow.className = 'sm-tab-row';
          const contentTab = document.createElement('button');
          contentTab.className = 'sm-tab active';
          contentTab.textContent = '内容标签';
          const stageTab = document.createElement('button');
          stageTab.className = 'sm-tab';
          stageTab.textContent = '学段标签';
          tabRow.appendChild(contentTab);
          tabRow.appendChild(stageTab);
          body.appendChild(tabRow);

          const listContainer = document.createElement('div');
          body.appendChild(listContainer);

          function showTags(type) {
            const tags = type === 'content' ? currentCategory.contentTags : currentCategory.stageTags;
            listContainer.innerHTML = '';

            tags.forEach(tag => {
              const item = document.createElement('div');
              item.className = 'sm-group-item';

              const input = document.createElement('input');
              input.type = 'text';
              input.value = tag.name;
              input.className = 'sm-select';
              input.style.flex = '1';
              input.addEventListener('change', () => {
                tag.name = input.value.trim() || tag.name;
                saveData(appData);
                render();
              });

              const delBtn = document.createElement('button');
              delBtn.className = 'sm-btn sm-btn--small sm-btn--danger';
              delBtn.textContent = '删除';
              delBtn.addEventListener('click', () => {
                // Remove tag from all stages
                currentCategory.stages.forEach(s => {
                  s.tags[type] = s.tags[type].filter(t => t !== tag.id);
                });
                if (type === 'content') {
                  currentCategory.contentTags = currentCategory.contentTags.filter(t => t.id !== tag.id);
                } else {
                  currentCategory.stageTags = currentCategory.stageTags.filter(t => t.id !== tag.id);
                }
                saveData(appData);
                render();
                showTags(type);
              });

              item.appendChild(input);
              item.appendChild(delBtn);
              listContainer.appendChild(item);
            });

            // Add new
            const addRow = document.createElement('div');
            addRow.className = 'sm-row';
            addRow.style.marginTop = '12px';
            const addInput = document.createElement('input');
            addInput.type = 'text';
            addInput.placeholder = '新标签名称';
            addInput.className = 'sm-select';
            addInput.style.flex = '1';
            const addBtn = document.createElement('button');
            addBtn.className = 'sm-btn sm-btn--primary';
            addBtn.textContent = '添加';
            addBtn.addEventListener('click', () => {
              const name = addInput.value.trim();
              if (name) {
                const newTag = { id: generateId('tag-'), name };
                if (type === 'content') {
                  currentCategory.contentTags.push(newTag);
                } else {
                  currentCategory.stageTags.push(newTag);
                }
                saveData(appData);
                render();
                showTags(type);
              }
            });
            addRow.appendChild(addInput);
            addRow.appendChild(addBtn);
            listContainer.appendChild(addRow);
          }

          contentTab.addEventListener('click', () => {
            contentTab.classList.add('active');
            stageTab.classList.remove('active');
            showTags('content');
          });
          stageTab.addEventListener('click', () => {
            stageTab.classList.add('active');
            contentTab.classList.remove('active');
            showTags('stage');
          });

          showTags('content');
        });
    },
  }, setActiveTags);
}
